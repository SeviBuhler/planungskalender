<button type="button" class="w-full flex items-center justify-between gap-2 p-2 rounded-lg bg-white text-left text-indigo-950 shadow-sm ring-1 ring-black/5 transition hover:ring-indigo-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        role="combobox" aria-haspopup="listbox" [attr.aria-expanded]="open()" [attr.aria-controls]="listId" [attr.aria-label]="ariaLabel() || null"
        (click)="toggle()" (keydown)="onKeydown($event)">
    <span class="truncate">{{ selected()?.label ?? '' }}</span>
    <svg class="h-4 w-4 shrink-0 text-indigo-500 transition-transform duration-200" [class.rotate-180]="open()" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.17l3.71-3.94a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06z" clip-rule="evenodd" />
    </svg>
</button>
@if (open()) {
    <ul class="fixed z-60 max-h-64 overflow-y-auto rounded-xl bg-white p-1 text-indigo-950 shadow-xl ring-1 ring-black/5"
        role="listbox" [id]="listId"
        [style.top.px]="position()?.top" [style.bottom.px]="position()?.bottom" [style.left.px]="position()?.left" [style.width.px]="position()?.width" animate.enter="anim-drop-in" animate.leave="anim-drop-out">
        @for (option of options(); track option.value; let i = $index) {
            <li class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg cursor-pointer transition-colors"
                role="option" [attr.aria-selected]="option.value === value()"
                [class.bg-indigo-50]="i === active()" [class.font-semibold]="option.value === value()"
                (pointerenter)="active.set(i)" (click)="choose(option)">
                <span class="truncate">{{ option.label }}</span>
                @if (option.value === value()) {
                    <span class="text-indigo-600" aria-hidden="true">✓</span>
                }
            </li>
        }
    </ul>
}
