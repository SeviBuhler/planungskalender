<div class="flex justify-center place-items-center flex-col min-h-screen bg-gray-300 dark:bg-gray-800">
    <p class="m-3 mb-10 p-4 text-center text-sky-950 dark:text-sky-100 font-bold text-6xl md:text-7xl">Sign up</p>
    <input class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl text-center text-indigo-800 dark:text-indigo-950 bg-gray-100 dark:bg-gray-200" [(ngModel)]="email" placeholder="Email" />
    <input class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl text-center text-indigo-800 dark:text-indigo-950 bg-gray-100 dark:bg-gray-200" type="password" [(ngModel)]="password" placeholder="Password" />
    <input class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl text-center text-indigo-800 dark:text-indigo-950 bg-gray-100 dark:bg-gray-200" [(ngModel)]="displayName" placeholder="Username" />
    <button class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl bg-indigo-600 dark:bg-indigo-700 hover:bg-fuchsia-500 text-white dark:text-sky-100" (click)="handleSignup()">Registrieren</button>
</div>
