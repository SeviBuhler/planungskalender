<div class="flex justify-center place-items-center flex-col min-h-screen bg-gray-300 dark:bg-gray-800">
    <p class="m-3 mb-10 p-4 text-center text-sky-950 dark:text-sky-100 font-bold text-6xl md:text-7xl">Registrieren</p>

    @if (step() === 'form') {
        <form class="contents" (ngSubmit)="handleSignup()">
            <input class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl text-center text-indigo-800 dark:text-indigo-950 bg-gray-100 dark:bg-gray-200" name="email" type="email" autocomplete="username" [(ngModel)]="email" placeholder="E-Mail" />
            <input class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl text-center text-indigo-800 dark:text-indigo-950 bg-gray-100 dark:bg-gray-200" name="password" type="password" autocomplete="new-password" [(ngModel)]="password" placeholder="Passwort" />
            <p class="mx-3 w-full max-w-xs text-center text-xs text-[#25134D] dark:text-sky-100">{{ passwordRule }}</p>
            <input class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl text-center text-indigo-800 dark:text-indigo-950 bg-gray-100 dark:bg-gray-200" name="displayName" autocomplete="nickname" [(ngModel)]="displayName" placeholder="Name" />
            <button class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl bg-indigo-600 dark:bg-indigo-700 hover:bg-fuchsia-500 text-white dark:text-sky-100 disabled:opacity-60" type="submit" [disabled]="busy()">Registrieren</button>
        </form>
        <a class="m-3 text-sm underline text-[#25134D] dark:text-sky-100" routerLink="/login">Ich habe schon ein Konto</a>
    } @else {
        <p class="m-3 w-full max-w-xs text-center text-[#25134D] dark:text-sky-100">Wir haben dir einen Code an {{ email }} geschickt. Damit bestätigst du deine E-Mail-Adresse.</p>
        <form class="contents" (ngSubmit)="verifyCode()">
            <input class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl text-center text-2xl tracking-[0.3em] text-indigo-800 dark:text-indigo-950 bg-gray-100 dark:bg-gray-200" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" [(ngModel)]="code" placeholder="Code" />
            <button class="m-3 p-4 w-full max-w-xs rounded-lg shadow-2xl bg-indigo-600 dark:bg-indigo-700 hover:bg-fuchsia-500 text-white dark:text-sky-100 disabled:opacity-60" type="submit" [disabled]="busy()">Bestätigen</button>
        </form>
        <button class="m-3 p-3 w-full max-w-xs rounded-lg shadow bg-gray-100 dark:bg-gray-200 text-indigo-800 dark:text-indigo-950 hover:bg-white disabled:opacity-60" [disabled]="busy()" (click)="pasteCode()">Kopierten Code einfügen</button>
        <button class="m-3 text-sm underline text-[#25134D] dark:text-sky-100 disabled:opacity-60" [disabled]="busy()" (click)="resendCode()">Neuen Code senden</button>
    }

    @if (errorText()) {
        <p class="m-3 w-full max-w-xs text-center text-red-700 dark:text-red-300" role="alert">{{ errorText() }}</p>
    }
</div>
