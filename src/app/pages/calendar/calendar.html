<div class="flex flex-col min-h-screen bg-gray-300 dark:bg-gray-800 p-3 md:p-6">
    <header class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <p class="text-sky-950 dark:text-sky-100 font-bold text-3xl md:text-4xl">Calendar for Two</p>
        <div class="flex gap-2">
            <a class="px-4 py-2 rounded-lg shadow-2xl bg-indigo-600 dark:bg-indigo-700 hover:bg-fuchsia-500 text-white dark:text-sky-100" routerLink="/households">Haushalte</a>
            <a class="px-4 py-2 rounded-lg shadow-2xl bg-indigo-600 dark:bg-indigo-700 hover:bg-fuchsia-500 text-white dark:text-sky-100" routerLink="/finance">Finanzen</a>
            <button class="px-4 py-2 rounded-lg shadow-2xl bg-indigo-600 dark:bg-indigo-700 hover:bg-fuchsia-500 text-white dark:text-sky-100" (click)="handleLogout()">Logout</button>
        </div>
    </header>

    <div class="flex items-center justify-between gap-2 mb-3">
        <button class="px-4 py-2 rounded-lg shadow bg-indigo-600 dark:bg-indigo-700 hover:bg-fuchsia-500 text-white" (click)="previousMonth()" aria-label="Vorheriger Monat">‹</button>
        <div class="flex items-center gap-3">
            <h2 class="text-xl md:text-2xl font-semibold text-sky-950 dark:text-sky-100 capitalize">{{ monthLabel() }}</h2>
            <button class="px-3 py-1 rounded-lg shadow bg-gray-100 dark:bg-gray-200 text-indigo-800 hover:bg-fuchsia-100" (click)="goToToday()">Heute</button>
        </div>
        <button class="px-4 py-2 rounded-lg shadow bg-indigo-600 dark:bg-indigo-700 hover:bg-fuchsia-500 text-white" (click)="nextMonth()" aria-label="Nächster Monat">›</button>
    </div>

    <div class="grid grid-cols-7 gap-1 text-center text-sm font-semibold text-sky-950 dark:text-sky-100 mb-1">
        @for (weekday of weekdays; track weekday) {
            <div>{{ weekday }}</div>
        }
    </div>

    <div class="grid grid-cols-7 gap-1 flex-1">
        @for (day of days(); track day.date.getTime()) {
            <div class="min-h-16 md:min-h-24 rounded-lg p-1 md:p-2 text-left shadow"
                 [class.bg-gray-100]="day.inMonth"
                 [class.bg-gray-200]="!day.inMonth"
                 [class.opacity-50]="!day.inMonth">
                <span class="inline-flex h-7 w-7 items-center justify-center rounded-full text-sm"
                      [class.bg-indigo-600]="day.isToday"
                      [class.text-white]="day.isToday"
                      [class.text-indigo-800]="!day.isToday">{{ day.date.getDate() }}</span>
            </div>
        }
    </div>
</div>
